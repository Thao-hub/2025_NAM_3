<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>404 - Page not found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #ffffff;
      color: #0f172a;
    }
    .custom-bg {
      background: #ffffff;
      color: #0f172a;
    }
    .custom-btn {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      border-color: #e2e8f0 !important;
    }
    .custom-btn:hover {
      background-color: #e2e8f0 !important;
      transition: background-color 0.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="custom-bg text-dark">
    <div class="d-flex align-items-center justify-content-center min-vh-100 px-2">
      <div class="text-center">
        <h1 class="display-1 fw-bold">404</h1>
        <p class="fs-2 fw-medium mt-4">Oops! Page not found</p>
        <p class="mt-4 mb-5">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
          <a href="/report/404/retry/?back={{ request.path|urlencode }}&path={{ request.path|urlencode }}" class="btn btn-light fw-semibold rounded-pill px-4 py-2 custom-btn">
            🔄 Thử lại
          </a>
          <a href="/report/404/support/?path={{ request.path|urlencode }}" class="btn btn-light fw-semibold rounded-pill px-4 py-2 custom-btn">
            📩 Gửi yêu cầu hỗ trợ
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
