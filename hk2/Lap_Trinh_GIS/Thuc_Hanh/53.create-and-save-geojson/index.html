<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Create and save a geojson</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.0/leaflet.draw.css"
		/>
		<link rel="stylesheet" href="style.css" />
		<link
			href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css"
			rel="stylesheet"
		/>
		<script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.0/leaflet.draw.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/notiflix@3.2.2/dist/notiflix-notify-aio-3.2.2.min.js"></script>
		<script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
	</head>

	<body>
		<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
			<symbol id="icon-export" viewBox="0 0 24 24">
				<path
					d="M12 2a10 10 0 100 20 10 10 0 000-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"
				/>
			</symbol>
			<symbol id="icon-add" viewBox="0 0 24 24">

					d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v4h4v2h-4v4h-2v-4H7v-2h4V7h2z"
				/>
			</symbol>
			<symbol id="icon-remove" viewBox="0 0 24 24">
				<path
					d="M12 2a10 10 0 100 20 10 10 0 000-20zm-5 9h10v2H7v-2z"
				/>
			</symbol>
			<symbol id="icon-import" viewBox="0 0 24 24">
				<path
					d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 15v-4H7v-2h4V7h2v4h4v2h-4v4h-2z"
				/>
			</symbol>
		</svg>
		<div id="map"></div>
		<script src="script.js"></script>
	</body>
